server {
    listen 80;
    server_name _;

    # Page statique (formulaire)
    location / {
        root /usr/share/nginx/html;
        index index.html;
    }

    # Reverse-proxy vers le backend — même origine, donc pas de CORS côté navigateur
    location /api/ {
        proxy_pass http://backend:8001/;
        proxy_set_header Host $host;
        proxy_set_header X-Request-ID $request_id;
    }
}
